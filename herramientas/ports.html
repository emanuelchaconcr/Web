<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TCP / UDP Port Checker | Emanuel Chacón</title><link rel="stylesheet" href="tool.css"></head><body><main class="tool-page"><a class="back" href="../">← Emanuel Chacón</a><h1>TCP / UDP Port Checker</h1><div class="toolbox">
<label>Host / IP</label><input id="host" value="8.8.8.8">
<label>Puerto</label><input id="port" type="number" value="443">
<p style="color:#8d9aaa;font-size:12px">Desde el navegador no es posible realizar un escaneo TCP arbitrario de forma fiable. Esta herramienta valida el formato y genera el comando de diagnóstico.</p>
<button class="btn primary" onclick="go()">Generar diagnóstico</button><div id="out" class="result"></div></div></main><script>function go(){let h=host.value.trim(),p=+port.value;if(!h||p<1||p>65535)return out.textContent="Host o puerto inválido";out.textContent=`PowerShell:\nTest-NetConnection ${h} -Port ${p}\n\nLinux:\nnc -vz ${h} ${p}\n\nNmap:\nnmap -Pn -p ${p} ${h}` }</script></body></html>
