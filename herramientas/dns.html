<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DNS Record Builder | Emanuel Chacón</title><link rel="stylesheet" href="tool.css"></head><body><main class="tool-page"><a class="back" href="../">← Emanuel Chacón</a><h1>DNS Record Builder</h1><div class="toolbox">
<label>Dominio</label><input id="domain" value="example.com">
<label>Tipo</label><select id="type"><option>A</option><option>AAAA</option><option>CNAME</option><option>MX</option><option>TXT</option></select>
<button class="btn primary" onclick="go()">Generar comandos</button><div id="out" class="result"></div></div></main><script>function go(){let d=domain.value.trim(),t=type.value;out.textContent=`Windows / nslookup:\nnslookup -type=${t} ${d}\n\nLinux / dig:\ndig ${d} ${t}\n\nPowerShell:\nResolve-DnsName ${d} -Type ${t}` }</script></body></html>
