<main class="tool-page"><a class="back" href="../">← Emanuel Chacón</a><h1>IP Range Calculator</h1><div class="toolbox">
<label>Network CIDR</label><input id="cidr" value="10.10.20.0/24">
<button class="btn primary" onclick="go()">Calcular rango</button><div id="out" class="result"></div></div></main><script>function go(){let v=cidr.value.trim().split("/"),a=v[0].split(".").map(Number),p=+v[1];if(a.length!==4||p<0||p>32)return out.textContent="CIDR inválido";let n=(((a[0]<<24)>>>0)|((a[1]<<16)>>>0)|((a[2]<<8)>>>0)|a[3])>>>0,mask=p===0?0:(0xffffffff<<(32-p))>>>0,net=(n&mask)>>>0,b=p===32?net:(net+(2**(32-p)-1))>>>0,s=x=>[(x>>>24)&255,(x>>>16)&255,(x>>>8)&255,x&255].join(".");out.textContent=`Network: ${s(net)}\nBroadcast: ${s(b)}\nFirst: ${p>=31?s(net):s((net+1)>>>0)}\nLast: ${p>=31?s(b):s((b-1)>>>0)}\nTotal addresses: ${2**(32-p)}`}</script><script src="../js/main.js"></script></body></html>
