<main class="tool-page"><a class="back" href="../">← Emanuel Chacón</a><h1>Password Generator</h1><div class="toolbox"><label>Longitud</label><input id="len" type="number" min="8" max="128" value="24"><button class="btn primary" style="margin-top:16px" onclick="go()">Generar</button><div id="out" class="result"></div></div></main><script>function go(){let n=Math.min(128,Math.max(8,+len.value||24)),chars='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$%^&*_-+=';let a=new Uint32Array(n);crypto.getRandomValues(a);out.textContent=Array.from(a,x=>chars[x%chars.length]).join('')}</script><script src="../js/main.js"></script></body></html>
