<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Storage Calculator</title><link rel="stylesheet" href="tool.css"></head><body><main class="tool-page"><a class="back" href="../">← Emanuel Chacón</a><h1>Storage Calculator</h1><div class="toolbox"><div class="grid2"><div><label>Capacidad inicial (TB)</label><input id="cap" type="number" value="10"></div><div><label>Crecimiento mensual (%)</label><input id="growth" type="number" value="5"></div></div><label>Meses</label><input id="months" type="number" value="12"><button class="btn primary" style="margin-top:16px" onclick="go()">Calcular</button><div id="out" class="result"></div></div></main><script>function go(){let c=+cap.value,g=+growth.value/100,m=+months.value;let end=c*Math.pow(1+g,m);out.textContent=`Capacidad inicial: ${c.toFixed(2)} TB\\nCapacidad estimada: ${end.toFixed(2)} TB\\nCrecimiento: ${(end-c).toFixed(2)} TB`}</script></body></html>
