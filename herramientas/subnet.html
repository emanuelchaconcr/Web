<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Subnet Calculator</title><link rel="stylesheet" href="tool.css"></head><body><main class="tool-page"><a class="back" href="../">← Emanuel Chacón</a><h1>IPv4 Subnet Calculator</h1><div class="toolbox"><div class="grid2"><div><label>IP</label><input id="ip" value="192.168.1.10"></div><div><label>CIDR</label><select id="cidr"></select></div></div><button class="btn primary" style="margin-top:16px" onclick="calc()">Calcular</button><div id="out" class="result"></div></div></main><script>const c=document.getElementById('cidr');for(let i=0;i<=32;i++)c.innerHTML+=`<option ${i==24?'selected':''}>${i}</option>`;function ipn(s){return s.split('.').map(Number)}function calc(){let a=ipn(document.getElementById('ip').value),p=+c.value;if(a.length!=4||a.some(x=>x<0||x>255))return out.textContent='IP inválida';let mask=p===0?0:(0xffffffff<<(32-p))>>>0,n=((a[0]<<24)>>>0)|((a[1]<<16)>>>0)|((a[2]<<8)>>>0)|a[3],net=(n&mask)>>>0,b=p===32?net:(net+(2**(32-p)-1))>>>0;const s=x=>[(x>>>24)&255,(x>>>16)&255,(x>>>8)&255,x&255].join('.');out.textContent=`Network: ${s(net)}\\nBroadcast: ${s(b)}\\nMask: ${s(mask)}\\nPrefix: /${p}\\nHosts: ${p>=31?Math.max(0,2**(32-p)-2):2**(32-p)-2}`}</script></body></html>
