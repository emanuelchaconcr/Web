<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Linux Service Troubleshooter | Emanuel Chacón</title><link rel="stylesheet" href="tool.css"></head><body><main class="tool-page"><a class="back" href="../">← Emanuel Chacón</a><h1>Linux Service Troubleshooter</h1><div class="toolbox">
<label>Servicio</label><input id="svc" value="sshd">
<button class="btn primary" onclick="go()">Generar checklist</button><div id="out" class="result"></div></div></main><script>function go(){let s=svc.value.trim();out.textContent=`systemctl status ${s} --no-pager\nsystemctl is-enabled ${s}\nsystemctl is-active ${s}\njournalctl -u ${s} --since "1 hour ago" --no-pager\nsystemctl cat ${s}\nss -lntup\nps aux | grep ${s}`}</script></body></html>
