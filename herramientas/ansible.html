<main class="tool-page"><a class="back" href="../">← Emanuel Chacón</a><h1>Ansible Playbook Builder</h1><div class="toolbox"><div class="grid2"><div><label>Nombre</label><input id="name" value="Infrastructure Task"></div><div><label>Hosts</label><input id="hosts" value="servers"></div></div><label>Comando</label><input id="cmd" value="uptime"><button class="btn primary" style="margin-top:16px" onclick="go()">Generar YAML</button><div id="out" class="result"></div></div></main><script>function go(){let esc=s=>s.replace(/'/g,\"''\");out.textContent=`---\\n- name: ${esc(name.value)}\\n  hosts: ${esc(hosts.value)}\\n  become: true\\n  tasks:\\n    - name: Run command\\n      ansible.builtin.command: '${esc(cmd.value)}'\\n      register: result\\n\\n    - name: Show result\\n      ansible.builtin.debug:\\n        var: result.stdout`}</script><script src="../js/main.js"></script></body></html>
