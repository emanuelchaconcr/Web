<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IP Converter</title><link rel="stylesheet" href="tool.css"></head><body><main class="tool-page"><a class="back" href="../">← Emanuel Chacón</a><h1>IP Converter</h1><div class="toolbox"><label>IPv4</label><input id="ip" value="192.168.1.10"><button class="btn primary" style="margin-top:16px" onclick="go()">Convertir</button><div id="out" class="result"></div></div></main><script>function go(){let a=document.getElementById('ip').value.split('.').map(Number);if(a.length!==4||a.some(x=>!Number.isInteger(x)||x<0||x>255))return out.textContent='IP inválida';let n=((((a[0]*256)+a[1])*256+a[2])*256+a[3]);out.textContent=`Decimal: ${n}\\nBinary: ${a.map(x=>x.toString(2).padStart(8,'0')).join('.')}\\nHex: 0x${n.toString(16).toUpperCase().padStart(8,'0')}`}</script></body></html>
