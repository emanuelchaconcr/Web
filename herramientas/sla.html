<main class="tool-page"><a class="back" href="../">← Emanuel Chacón</a><h1>SLA / Downtime Calculator</h1><div class="toolbox"><label>SLA objetivo (%)</label><input id="sla" type="number" step="0.001" value="99.9"><label>Periodo</label><select id="period"><option value="525600">Año</option><option value="43200">Mes de 30 días</option><option value="10080">Semana</option><option value="1440">Día</option></select><button class="btn primary" style="margin-top:16px" onclick="go()">Calcular</button><div id="out" class="result"></div></div></main><script>function go(){let s=+sla.value,p=+period.value,d=p*(1-s/100);out.textContent=`SLA: ${s}%\\nDowntime permitido: ${d.toFixed(2)} minutos\\n≈ ${(d/60).toFixed(2)} horas`}</script><script src="../js/main.js"></script></body></html>
