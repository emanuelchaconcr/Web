<main class="tool-page"><a class="back" href="../">← Emanuel Chacón</a><h1>VMware Troubleshooting Helper</h1><div class="toolbox">

<button class="btn primary" onclick="go()">Generar checklist</button><div id="out" class="result"></div></div></main><script>function go(){let c=comp.value;let m={"ESXi Host":"esxcli system version get\nesxcli hardware platform get\nesxcli network ip interface list\nesxcli storage filesystem list\nesxcli vm process list\nvmkping <target>","vCenter":"service-control --status --all\nvmware-vmon-cli -h\nCheck vpxd and vpxd-svcs logs","VM":"vim-cmd vmsvc/getallvms\nvim-cmd vmsvc/get.summary <VMID>\nvim-cmd vmsvc/power.getstate <VMID>","Datastore":"esxcli storage filesystem list\nesxcli storage core device list\nesxcli storage nmp device list"};out.textContent=m[c]}`}</script><script src="../js/main.js"></script></body></html>
