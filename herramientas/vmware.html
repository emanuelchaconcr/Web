<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VMware Troubleshooting Helper | Emanuel Chacón</title><link rel="stylesheet" href="tool.css"></head><body><main class="tool-page"><a class="back" href="../">← Emanuel Chacón</a><h1>VMware Troubleshooting Helper</h1><div class="toolbox">
<label>VMware componente</label><select id="comp"><option>ESXi Host</option><option>vCenter</option><option>VM</option><option>Datastore</option></select>
<button class="btn primary" onclick="go()">Generar checklist</button><div id="out" class="result"></div></div></main><script>function go(){let c=comp.value;let m={"ESXi Host":"esxcli system version get\nesxcli hardware platform get\nesxcli network ip interface list\nesxcli storage filesystem list\nesxcli vm process list\nvmkping <target>","vCenter":"service-control --status --all\nvmware-vmon-cli -h\nCheck vpxd and vpxd-svcs logs","VM":"vim-cmd vmsvc/getallvms\nvim-cmd vmsvc/get.summary <VMID>\nvim-cmd vmsvc/power.getstate <VMID>","Datastore":"esxcli storage filesystem list\nesxcli storage core device list\nesxcli storage nmp device list"};out.textContent=m[c]}`}</script></body></html>
